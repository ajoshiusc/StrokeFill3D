# Cortical recovery fine-tune profile for the 24 GiB RTX 4090.
# Resume from the completed 80^3 4090 run; batch size 1 and AMP limit activation memory.
patch_size: [96, 96, 96]
spacing_mm: [1.0, 1.0, 1.0]
samples_per_scan: 2
batch_size: 1
num_workers: 2
epochs: 40
channels: [32, 64, 128]
attention_levels: [false, false, true]
num_head_channels: [0, 0, 32]
num_res_blocks: 1
time_embedding_scale: 1000.0
amp: true
learning_rate: 0.0001
weight_decay: 0.00001
grad_clip: 1.0
checkpoint_every_steps: 500
# Deliberately oversample target patches that contain cortex and donor masks placed at its surface.
cortical_patch_probability: 0.60
cortical_surface_band_voxels: 6
cortical_placement_probability: 0.60
cortical_min_foreground_overlap: 0.55
# Match the 0-2 voxel dilation used at inference.
max_mask_dilation_voxels: 2
